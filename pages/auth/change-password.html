<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/pages/auth.css">
</head>
<body>
  <div id="header"></div>

  <main class="container"><section class="card auth-shell"><h1>Đổi mật khẩu</h1><p class="auth-intro">Sử dụng mật khẩu mới có ít nhất 6 ký tự.</p><div class="auth-message hidden" id="auth-message" role="alert"></div><form id="auth-form" data-page="change-password" novalidate><div class="form-group"><label class="form-label" for="oldPassword">Mật khẩu hiện tại</label><input class="form-control" id="oldPassword" name="oldPassword" type="password" autocomplete="current-password" required><span class="form-error" id="error-oldPassword"></span></div><div class="form-group"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="6" required><span class="form-error" id="error-password"></span></div><div class="form-group"><label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><span class="form-error" id="error-confirmPassword"></span></div><button class="btn btn-primary" type="submit">Đổi mật khẩu</button><div class="auth-links"><a href="profile.html">Về hồ sơ</a></div></form></section></main>

  <div id="footer"></div>

  <script src="../../assets/js/lib/jquery.min.js"></script>
  <script src="../../assets/js/common/config.js"></script>
  <script src="../../assets/js/common/storage.js"></script>
  <script src="../../assets/js/common/utils.js"></script>
  <script src="../../assets/js/common/auth.js"></script>
  <script src="../../assets/js/common/toast.js"></script>
  <script src="../../assets/js/common/layout.js"></script>
  <script src="../../assets/js/pages/auth.js"></script>
</body>
</html>
