<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/pages/auth.css">
</head>
<body>
  <div id="header"></div>

  <main class="container"><section class="card auth-shell"><h1>Đăng ký</h1><p class="auth-intro">Chọn vai trò phù hợp với bạn.</p><div class="auth-message hidden" id="auth-message" role="alert"></div><form id="auth-form" data-page="register" novalidate><div class="tabs" role="group" aria-label="Vai trò đăng ký"><button type="button" class="btn active" data-role="student" aria-pressed="true">Học viên</button><button type="button" class="btn" data-role="instructor" aria-pressed="false">Giảng viên</button></div><div class="form-group"><label class="form-label" for="name">Họ tên</label><input class="form-control" id="name" name="name" type="text" autocomplete="name" required><span class="form-error" id="error-name"></span></div><div class="form-group"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required><span class="form-error" id="error-email"></span></div><div class="form-group"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="6" required><span class="form-error" id="error-password"></span></div><div class="form-group"><label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><span class="form-error" id="error-confirmPassword"></span></div><div id="instructor-fields" class="hidden"><div class="form-group"><label class="form-label" for="specialty">Chuyên môn</label><input class="form-control" id="specialty" name="specialty" type="text"  required><span class="form-error" id="error-specialty"></span></div><div class="form-group"><label class="form-label" for="bio">Giới thiệu ngắn</label><textarea class="form-control" id="bio" name="bio" maxlength="500"></textarea><span class="form-error" id="error-bio"></span></div></div><button class="btn btn-primary" type="submit">Đăng ký</button><div class="auth-links"><a href="login.html">Đã có tài khoản? Đăng nhập</a></div></form></section></main>

  <div id="footer"></div>

  <script src="../../assets/js/lib/jquery.min.js"></script>
  <script src="../../assets/js/common/config.js"></script>
  <script src="../../assets/js/common/storage.js"></script>
  <script src="../../assets/js/common/utils.js"></script>
  <script src="../../assets/js/common/auth.js"></script>
  <script src="../../assets/js/common/toast.js"></script>
  <script src="../../assets/js/common/layout.js"></script>
  <script src="../../assets/js/pages/auth.js"></script>
</body>
</html>
