<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/pages/auth.css">
</head>
<body>
  <div id="header"></div>

  <main class="container"><section class="card auth-shell"><h1>Đăng nhập</h1><p class="auth-intro">Tiếp tục hành trình học tập của bạn.</p><div class="auth-message hidden" id="auth-message" role="alert"></div><form id="auth-form" data-page="login" novalidate><div class="form-group"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required><span class="form-error" id="error-email"></span></div><div class="form-group"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required><span class="form-error" id="error-password"></span></div><button class="btn btn-primary" type="submit">Đăng nhập</button><div class="auth-links"><a href="forgot-password.html">Quên mật khẩu?</a><a href="register.html">Tạo tài khoản</a></div></form></section></main>

  <div id="footer"></div>

  <script src="../../assets/js/lib/jquery.min.js"></script>
  <script src="../../assets/js/common/config.js"></script>
  <script src="../../assets/js/common/storage.js"></script>
  <script src="../../assets/js/common/utils.js"></script>
  <script src="../../assets/js/common/auth.js"></script>
  <script src="../../assets/js/common/toast.js"></script>
  <script src="../../assets/js/common/layout.js"></script>
  <script src="../../assets/js/pages/auth.js"></script>
</body>
</html>
